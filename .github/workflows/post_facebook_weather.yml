name: Post Calauan Weather to Facebook

on:
  schedule:
    # Runs daily at 22:00 UTC (6:00 AM Philippine Standard Time UTC+8)
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  generate-and-post:
    name: Generate Infographic & Post to Facebook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy matplotlib shapely

      - name: Generate Weather Report Infographic & Caption
        run: |
          python create_calauan_weather_report.py
          ls -lh calauan_weather_report.png facebook_caption.txt

      - name: Upload Infographic to Facebook Page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          if [ -z "$FB_PAGE_ID" ] || [ -z "$FB_ACCESS_TOKEN" ]; then
            echo "::warning::Facebook secrets (FB_PAGE_ID / FB_ACCESS_TOKEN) are not configured in GitHub Repository Secrets. Skipping Facebook post."
            exit 0
          fi

          echo "Posting daily Calauan weather report to Facebook Page $FB_PAGE_ID..."
          
          # Upload image with message using Facebook Graph API
          RESPONSE=$(curl -s -X POST \
            "https://graph.facebook.com/v20.0/${FB_PAGE_ID}/photos" \
            -F "access_token=${FB_ACCESS_TOKEN}" \
            -F "message=$(cat facebook_caption.txt)" \
            -F "source=@calauan_weather_report.png")

          echo "Facebook API Response: $RESPONSE"
          
          # Check if post was successful (response contains photo ID or post ID)
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "Successfully published weather forecast to Facebook!"
          else
            echo "::error::Failed to post to Facebook: $RESPONSE"
            exit 1
          fi

      - name: Archive Generated Report & Caption
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calauan-weather-report-assets
          path: |
            calauan_weather_report.png
            facebook_caption.txt
          retention-days: 14

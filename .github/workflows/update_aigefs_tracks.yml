name: Update NOAA AI-GEFS TC Tracks
on:
  schedule:
    - cron: '15 4,10,16,22 * * *' # Run 4 times a day (after NCEP runs 00, 06, 12, 18Z)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install system dependencies (proj for cartopy)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib cartopy
          
      - name: Download and Process AI-GEFS Tracks
        run: |
          python tc_aigefs_tracks.py
          
      - name: Generate static map images
        run: |
          python plot_aigefs_tracks.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the generated files
          git add -f public/data/aigefs_tc_latest.enc || true
          git add -f public/data/aigefs_tc_latest.csv || true
          git add public/assets/aigefs_tropical_cyclone_* || true
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update NOAA AI-GEFS TC Tracks and Images [skip ci]"
          fi
          
          # Stash any remaining unstaged/untracked files (like __pycache__) so pull rebase succeeds
          git stash --include-untracked || true
          
          # Pull rebase with 'theirs' strategy, auto-resolve rename/delete conflicts
          git pull --rebase -X theirs origin main || {
            echo "Rebase conflict detected, auto-resolving..."
            git add -A
            GIT_EDITOR=true git rebase --continue || git rebase --skip
          }
          git stash pop || true
          git push
